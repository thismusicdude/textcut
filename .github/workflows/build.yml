# Builds and tests TextCut on Linux, Windows and macOS.
# - every push / pull request: test + build, binaries downloadable as workflow artifacts
# - tag "v*" (e.g. v0.2.0): additionally creates a GitHub release with the archives attached
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            suffix: linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            suffix: windows-x86_64
          - name: macOS universal
            os: macos-latest
            suffix: macos-universal

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      # --- system dependencies (ffmpeg is needed by the end-to-end tests) ---
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev libgl1-mesa-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev fonts-dejavu-core
          # Ubuntu's ffmpeg 6.1 lacks "-/filter_complex"; use a current static build.
          curl -sSL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
          mkdir -p "$HOME/ffmpeg" && tar -xJf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: ffmpeg version
        run: ffmpeg -version
        shell: bash

      # --- test & build ---
      - name: Test
        run: cargo test --release

      - name: Build
        if: runner.os != 'macOS'
        run: cargo build --release

      - name: Build (macOS universal binary)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/textcut \
            target/aarch64-apple-darwin/release/textcut \
            target/x86_64-apple-darwin/release/textcut
          lipo -info target/release/textcut

      # --- package ---
      - name: Package
        id: package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          name="textcut-${version}-${{ matrix.suffix }}"
          mkdir "$name"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/textcut.exe "$name/"
          else
            cp target/release/textcut "$name/"
          fi
          cp README.md "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" "$name"
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
