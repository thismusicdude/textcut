[package]
name = "textcutforge"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "TextCutForge – textbasierter Videoschnitt mit automatischer Stille-Entfernung"
license = "MIT"

[dependencies]
eframe = "0.31"
rfd = "0.15"
rodio = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ab_glyph = "0.2"
png = "0.17"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
